name: Flutter Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter config --enable-web --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build portable web download (root path)
        run: flutter build web --release --base-href / --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: iskedyul-web-local
          path: build/web/
          if-no-files-found: error
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test local launcher
        working-directory: tool/launcher
        run: go test ./...
      - name: Package Windows download
        run: python3 tool/package_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: iskedyul-laptop-downloads
          path: build/downloads/iskedyul-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  windows-check:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iskedyul-laptop-downloads
          path: downloads
      - name: Run packaged executable on Windows
        shell: pwsh
        run: ./tool/check_windows.ps1 -Archive downloads/iskedyul-windows-x64.zip

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Configure Android build tools
        run: |
          flutter config --enable-android --no-analytics
          flutter config --jdk-dir "$JAVA_HOME"
          sdkmanager 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: flutter pub get --enforce-lockfile
      # Build only: no Android device or emulator tests are run.
      - name: Build installable Android APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Package APK and verify its signature
        run: |
          mkdir -p build/downloads/android
          cp build/app/outputs/flutter-apk/app-release.apk build/downloads/android/iskedyul-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/downloads/android/iskedyul-android.apk
          cd build/downloads/android
          sha256sum iskedyul-android.apk > iskedyul-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: iskedyul-android-apk
          path: build/downloads/android/*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, windows-check, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iskedyul-laptop-downloads
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          name: iskedyul-android-apk
          path: downloads
      - name: Publish Windows and Android downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: web-${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" downloads/iskedyul-windows-x64.zip downloads/iskedyul-android.apk downloads/iskedyul-android.apk.sha256 --target "$BUILD_SHA" --latest --title "iSkedyul · Windows and Android build $BUILD_NUMBER" --notes-file tool/WINDOWS_RELEASE.md
          else
            gh release upload "$RELEASE_TAG" downloads/iskedyul-windows-x64.zip downloads/iskedyul-android.apk downloads/iskedyul-android.apk.sha256 --clobber
          fi
