name: Flutter Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter config --enable-web --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build portable web download (root path)
        run: flutter build web --release --base-href / --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: iskedyul-web-local
          path: build/web/
          if-no-files-found: error
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test local launcher
        working-directory: tool/launcher
        run: go test ./...
      - name: Package laptop downloads
        run: python3 tool/package_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: iskedyul-laptop-downloads
          path: build/downloads/*.zip
          if-no-files-found: error
      - name: Build GitHub Pages site
        run: flutter build web --release --base-href /iskedyul/ --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iskedyul-laptop-downloads
          path: downloads
      - name: Publish laptop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: web-${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --latest --title "iSkedyul · Web build ${{ github.run_number }}" --notes "Download the ZIP for your laptop, extract it, and open Start-iSkedyul. No Flutter or emulator required. See README.md for instructions."
          fi
          gh release upload "$RELEASE_TAG" downloads/*.zip --clobber
